version: 3
workdir: ./

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"
  - ".*/tests/.*"

components:
  # Core business logic
  domain: { in: internal/core/** }

  # Interface definitions
  ports: { in: internal/ports/** }

  # HTTP handlers and API adapters
  primary_adapters: { in: internal/adapters/api/** }

  # Middleware for HTTP adapters
  middleware: { in: internal/adapters/middleware/** }

  # External system adapters
  secondary_adapters_external: { in: internal/adapters/external/** }

  secondary_adapters_database: { in: internal/adapters/database/** }

  secondary_adapters_infrastructure: { in: internal/adapters/infrastructure/** }

  # Email service adapters
  secondary_adapters_email: { in: internal/adapters/email/** }

  # Service adapters for cross-context communication
  services: { in: internal/adapters/services/** }

  # Application orchestration
  application: { in: internal/app/** }

  # Configuration management
  config: { in: internal/config/** }

  # Entry points
  cmd: { in: cmd/** }

  # Test mocks
  mocks: { in: internal/mocks/** }

  # Shared utilities (available to all components)
  pkg: { in: pkg/** }

commonComponents:
  - mocks
  - pkg

deps:
  domain:
    mayDependOn:
      - domain
      - ports

  primary_adapters:
    mayDependOn:
      - domain
      - ports
      - middleware

  secondary_adapters_external:
    mayDependOn:
      - domain
      - ports
      - config
      - secondary_adapters_infrastructure

  secondary_adapters_database:
    mayDependOn:
      - domain
      - ports
      - config
      - secondary_adapters_infrastructure

  secondary_adapters_infrastructure:
    mayDependOn:
      - domain
      - ports
      - config

  secondary_adapters_email:
    mayDependOn:
      - domain
      - ports
      - config

  services:
    mayDependOn:
      - domain
      - ports

  application:
    mayDependOn:
      - domain
      - ports
      - primary_adapters
      - secondary_adapters_external
      - secondary_adapters_database
      - secondary_adapters_infrastructure
      - secondary_adapters_email
      - services
      - config
      - middleware

  config:
    mayDependOn:
      - domain

  cmd:
    mayDependOn:
      - application
      - config

  mocks:
    mayDependOn:
      - ports
      - domain