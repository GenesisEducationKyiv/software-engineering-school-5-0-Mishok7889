name: Architecture Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-arch-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-arch-

    - name: Install go-arch-lint
      run: go install github.com/fe3dback/go-arch-lint@latest

    - name: Run architecture tests
      run: |
        echo "Running architecture validation..."
        go-arch-lint check

    - name: Check if dependency graph exists
      run: |
        if [ -f docs/dependency_graph.svg ]; then
          echo "✅ Architecture dependency graph found at docs/dependency_graph.svg"
          echo "GRAPH_EXISTS=true" >> $GITHUB_ENV
        else
          echo "⚠️ Architecture dependency graph not found. Please run pre-commit hooks or commit the generated graph."
          echo "GRAPH_EXISTS=false" >> $GITHUB_ENV
        fi

    - name: Comment PR with architecture results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prBranch = context.payload.pull_request.head.ref;
          const graphExists = process.env.GRAPH_EXISTS === 'true';
          
          let body = '## 🏗️ Architecture Tests Results\n\n';
          body += '✅ **Architecture validation passed!**\n\n';
          body += 'Your code follows the hexagonal architecture dependency rules:\n';
          body += '- Domain layer has no external dependencies\n';
          body += '- Ports layer depends only on domain\n';
          body += '- Adapters depend on ports and domain\n';
          body += '- Application layer coordinates all components\n\n';
          
          if (graphExists) {
            body += '## 📊 Architecture Dependency Graph\n\n';
            body += '<details>\n';
            body += '<summary>🔍 Click to view architecture diagram</summary>\n\n';
            body += `📁 **Files:**\n`;
            body += `- [View SVG](https://github.com/${owner}/${repo}/blob/${prBranch}/docs/dependency_graph.svg)\n`;
            body += '</details>\n\n';
          } else {
            body += '## ⚠️ Architecture Dependency Graph\n\n';
            body += '**Dependency graph not found.** Please ensure pre-commit hooks are installed and run:\n';
            body += '```bash\n';
            body += 'pre-commit install\n';
            body += 'pre-commit run generate-dependency-graph\n';
            body += '```\n\n';
          }
          
          body += '---\n';
          body += '*This comment was automatically generated by the architecture tests workflow.*';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
