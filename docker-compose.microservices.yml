services:
  # Message Broker
  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--jetstream --http_port 8222"
    restart: unless-stopped
    networks:
      - microservices-network

  # Databases
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=weatherapi
    restart: unless-stopped
    networks:
      - microservices-network

  user-db:
    image: postgres:15-alpine
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=userapi
    restart: unless-stopped
    networks:
      - microservices-network

  subscription-db:
    image: postgres:15-alpine
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=subscriptionapi
    restart: unless-stopped
    networks:
      - microservices-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - microservices-network

  # Weather Service (gRPC)
  weather-service:
    build:
      context: .
      dockerfile: Dockerfile.weather-service
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      - WEATHER_SERVICE_PORT=8081
      - WEATHER_SERVICE_HOST=0.0.0.0
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - WEATHER_API_BASE_URL=https://api.weatherapi.com/v1
      - CACHE_TYPE=redis
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    restart: unless-stopped
    networks:
      - microservices-network

  # User Service (gRPC)
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    ports:
      - "8082:8082"
    depends_on:
      - user-db
    environment:
      - USER_SERVICE_PORT=8082
      - USER_SERVICE_HOST=0.0.0.0
      - USER_DB_HOST=user-db
      - USER_DB_PORT=5432
      - USER_DB_USER=postgres
      - USER_DB_PASSWORD=postgres
      - USER_DB_NAME=userapi
      - USER_DB_SSL_MODE=disable
    restart: unless-stopped
    networks:
      - microservices-network

  # Subscription Service (HTTP REST)
  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile.subscription-service
    ports:
      - "8083:8083"
    depends_on:
      - subscription-db
      - user-service
    environment:
      - SUBSCRIPTION_SERVICE_PORT=8083
      - SUBSCRIPTION_SERVICE_HOST=0.0.0.0
      - SUBSCRIPTION_DB_HOST=subscription-db
      - SUBSCRIPTION_DB_PORT=5432
      - SUBSCRIPTION_DB_USER=postgres
      - SUBSCRIPTION_DB_PASSWORD=postgres
      - SUBSCRIPTION_DB_NAME=subscriptionapi
      - SUBSCRIPTION_DB_SSL_MODE=disable
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8082
      - EMAIL_SMTP_HOST=mailhog
      - EMAIL_SMTP_PORT=1025
      - EMAIL_FROM_NAME=Weather API
      - EMAIL_FROM_ADDRESS=noreply@weatherapi.app
      - MESSAGE_BROKER_URL=nats://nats:4222
    restart: unless-stopped
    networks:
      - microservices-network

  # Notification Service (HTTP REST + Message Consumer)
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    ports:
      - "8084:8084"
    depends_on:
      - nats
      - subscription-service
      - weather-service
      - user-service
    environment:
      - NOTIFICATION_SERVICE_PORT=8084
      - NOTIFICATION_SERVICE_HOST=0.0.0.0
      - MESSAGE_BROKER_URL=nats://nats:4222
      - SUBSCRIPTION_SERVICE_HOST=subscription-service
      - SUBSCRIPTION_SERVICE_PORT=8083
      - WEATHER_SERVICE_HOST=weather-service
      - WEATHER_SERVICE_PORT=8081
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8082
      - EMAIL_SMTP_HOST=mailhog
      - EMAIL_SMTP_PORT=1025
      - EMAIL_FROM_NAME=Weather API
      - EMAIL_FROM_ADDRESS=noreply@weatherapi.app
    restart: unless-stopped
    networks:
      - microservices-network

  # Email Testing (MailHog)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:
  user_postgres_data:
  subscription_postgres_data:
  redis_data:

networks:
  microservices-network:
    driver: bridge
