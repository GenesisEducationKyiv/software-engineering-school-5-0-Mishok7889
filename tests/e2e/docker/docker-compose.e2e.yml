services:
  # Message Broker
  nats-e2e:
    image: nats:2.9-alpine
    ports:
      - "4223:4222"
      - "8223:8222"
    command: "--jetstream --http_port 8222"
    networks:
      - e2e-network

  # Databases
  postgres-e2e:
    image: postgres:15
    environment:
      POSTGRES_DB: weatherapi_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    networks:
      - e2e-network

  user-db-e2e:
    image: postgres:15
    environment:
      POSTGRES_DB: userapi_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    networks:
      - e2e-network

  subscription-db-e2e:
    image: postgres:15
    environment:
      POSTGRES_DB: subscriptionapi_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5437:5432"
    networks:
      - e2e-network

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - e2e-network

  # Mock Services
  mock-weather-api-e2e:
    build:
      context: ../../../tests/mocks/weather-server
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    networks:
      - e2e-network

  mailhog-e2e:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"  # SMTP
      - "8026:8025"  # Web UI
    networks:
      - e2e-network

  # Core Services
  weather-service-e2e:
    build:
      context: ../../..
      dockerfile: Dockerfile.weather-service
    ports:
      - "8086:8081"
    depends_on:
      - redis-e2e
      - mock-weather-api-e2e
    environment:
      - WEATHER_SERVICE_PORT=8081
      - WEATHER_SERVICE_HOST=0.0.0.0
      - WEATHER_API_KEY=test-api-key
      - WEATHER_API_BASE_URL=http://mock-weather-api-e2e:8080
      - WEATHER_PROVIDER_ORDER=weatherapi,openweathermap,accuweather
      - WEATHER_ENABLE_CACHE=true
      - WEATHER_ENABLE_LOGGING=false
      - WEATHER_CACHE_TTL_MINUTES=10
      - WEATHER_LOG_FILE_PATH=logs/weather_providers.log
      - CACHE_TYPE=redis
      - REDIS_ADDR=redis-e2e:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_DIAL_TIMEOUT=5
      - REDIS_READ_TIMEOUT=3
      - REDIS_WRITE_TIMEOUT=3
    networks:
      - e2e-network
    restart: unless-stopped

  user-service-e2e:
    build:
      context: ../../..
      dockerfile: Dockerfile.user-service
    ports:
      - "8087:8082"
    depends_on:
      - user-db-e2e
    environment:
      - USER_SERVICE_PORT=8082
      - USER_SERVICE_HOST=0.0.0.0
      - USER_DB_HOST=user-db-e2e
      - USER_DB_PORT=5432
      - USER_DB_USER=e2e_user
      - USER_DB_PASSWORD=e2e_pass
      - USER_DB_NAME=userapi_e2e
      - USER_DB_SSL_MODE=disable
    networks:
      - e2e-network
    restart: unless-stopped

  notification-service-e2e:
    build:
      context: ../../..
      dockerfile: Dockerfile.notification-service
    ports:
      - "8089:8084"
    depends_on:
      - nats-e2e
      - mailhog-e2e
    environment:
      - NOTIFICATION_SERVICE_PORT=8084
      - NOTIFICATION_SERVICE_HOST=0.0.0.0
      - MESSAGE_BROKER_URL=nats://nats-e2e:4222
      - SUBSCRIPTION_SERVICE_HOST=subscription-service-e2e
      - SUBSCRIPTION_SERVICE_PORT=8083
      - WEATHER_SERVICE_HOST=weather-service-e2e
      - WEATHER_SERVICE_PORT=8081
      - USER_SERVICE_HOST=user-service-e2e
      - USER_SERVICE_PORT=8082
      - EMAIL_SMTP_HOST=mailhog-e2e
      - EMAIL_SMTP_PORT=1025
      - EMAIL_SMTP_USERNAME=
      - EMAIL_SMTP_PASSWORD=
      - EMAIL_FROM_NAME=Weather API E2E
      - EMAIL_FROM_ADDRESS=test@weatherapi.com
      - APP_URL=http://localhost:8080
    networks:
      - e2e-network
    restart: unless-stopped

  subscription-service-e2e:
    build:
      context: ../../..
      dockerfile: Dockerfile.subscription-service
    ports:
      - "8088:8083"
    depends_on:
      - subscription-db-e2e
      - nats-e2e
      - notification-service-e2e
    environment:
      - SUBSCRIPTION_SERVICE_PORT=8083
      - SUBSCRIPTION_SERVICE_HOST=0.0.0.0
      - SUBSCRIPTION_DB_HOST=subscription-db-e2e
      - SUBSCRIPTION_DB_PORT=5432
      - SUBSCRIPTION_DB_USER=e2e_user
      - SUBSCRIPTION_DB_PASSWORD=e2e_pass
      - SUBSCRIPTION_DB_NAME=subscriptionapi_e2e
      - SUBSCRIPTION_DB_SSL_MODE=disable
      - USER_SERVICE_HOST=user-service-e2e
      - USER_SERVICE_PORT=8082
      - NOTIFICATION_SERVICE_HOST=notification-service-e2e
      - NOTIFICATION_SERVICE_PORT=8084
      - MESSAGE_BROKER_URL=nats://nats-e2e:4222
      - APP_URL=http://localhost:8080
    networks:
      - e2e-network
    restart: unless-stopped

  api-gateway-e2e:
    build:
      context: ../../..
      dockerfile: cmd/api-gateway/Dockerfile
    ports:
      - "8080:8080"  # Main UI and API endpoint for tests
    depends_on:
      - subscription-service-e2e
    environment:
      - GATEWAY_SERVICE_PORT=8080
      - GATEWAY_SERVICE_HOST=0.0.0.0
      - WEATHER_SERVICE_HOST=weather-service-e2e
      - WEATHER_SERVICE_PORT=8081
      - USER_SERVICE_HOST=user-service-e2e
      - USER_SERVICE_PORT=8082
      - SUBSCRIPTION_SERVICE_HOST=subscription-service-e2e
      - SUBSCRIPTION_SERVICE_PORT=8083
    networks:
      - e2e-network
    restart: unless-stopped

networks:
  e2e-network:
    driver: bridge
