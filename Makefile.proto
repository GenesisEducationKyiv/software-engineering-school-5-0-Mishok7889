# Makefile for generating protobuf files

.PHONY: proto-gen proto-clean

# Generate protobuf files
proto-gen:
	@echo "Generating protobuf files..."
	@mkdir -p api/proto/weather
	@mkdir -p api/proto/auth
	protoc --go_out=. --go_opt=paths=source_relative \
		--go-grpc_out=. --go-grpc_opt=paths=source_relative \
		api/proto/weather/weather.proto
	protoc --go_out=. --go_opt=paths=source_relative \
		--go-grpc_out=. --go-grpc_opt=paths=source_relative \
		api/proto/auth/auth.proto
	@echo "Protobuf files generated successfully"

# Clean generated protobuf files  
proto-clean:
	@echo "Cleaning generated protobuf files..."
	@rm -f api/proto/weather/*.pb.go
	@rm -f api/proto/auth/*.pb.go
	@echo "Generated protobuf files cleaned"

# Install protobuf tools (run once)
proto-install:
	@echo "Installing protobuf tools..."
	go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
	go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
	@echo "Protobuf tools installed successfully"
