services:
  # Message Broker
  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--jetstream --http_port 8222"
    restart: unless-stopped
    networks:
      - app-network

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - prometheus

  # Databases
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=weatherapi
    restart: unless-stopped
    networks:
      - app-network

  user-db:
    image: postgres:15-alpine
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=userapi
    restart: unless-stopped
    networks:
      - app-network

  subscription-db:
    image: postgres:15-alpine
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=subscriptionapi
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-network

  # Weather Service (gRPC) with Metrics
  weather-service:
    build:
      context: .
      dockerfile: Dockerfile.weather-service
    ports:
      - "8081:8081"
      - "9081:9081"  # Dedicated metrics port
    depends_on:
      - redis
    environment:
      - WEATHER_SERVICE_PORT=8081
      - WEATHER_SERVICE_HOST=0.0.0.0
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - WEATHER_API_BASE_URL=https://api.weatherapi.com/v1
      - WEATHER_PROVIDER_ORDER=weatherapi,openweathermap,accuweather
      - WEATHER_ENABLE_CACHE=true
      - WEATHER_ENABLE_LOGGING=true
      - WEATHER_CACHE_TTL_MINUTES=10
      - WEATHER_LOG_FILE_PATH=logs/weather_providers.log
      - CACHE_TYPE=redis
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_DIAL_TIMEOUT=5
      - REDIS_READ_TIMEOUT=3
      - REDIS_WRITE_TIMEOUT=3
      # Observability
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - LOG_LEVEL=info
      - LOG_SAMPLING_DEBUG=0.01
      - LOG_SAMPLING_INFO=0.1
      - LOG_SAMPLING_WARN=0.8
      - LOG_SAMPLING_ERROR=1.0
    restart: unless-stopped
    networks:
      - app-network

  # User Service (gRPC) with Metrics
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    ports:
      - "8082:8082"
      - "9082:9082"  # Dedicated metrics port
    depends_on:
      - user-db
    environment:
      - USER_SERVICE_PORT=8082
      - USER_SERVICE_HOST=0.0.0.0
      - USER_DB_HOST=user-db
      - USER_DB_PORT=5432
      - USER_DB_USER=postgres
      - USER_DB_PASSWORD=postgres
      - USER_DB_NAME=userapi
      - USER_DB_SSL_MODE=disable
      # Observability
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - LOG_LEVEL=info
      - LOG_SAMPLING_DEBUG=0.01
      - LOG_SAMPLING_INFO=0.1
      - LOG_SAMPLING_WARN=0.8
      - LOG_SAMPLING_ERROR=1.0
    restart: unless-stopped
    networks:
      - app-network

  # Subscription Service (HTTP REST) with Metrics
  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile.subscription-service
    ports:
      - "8083:8083"
      - "9083:9083"  # Dedicated metrics port
    depends_on:
      - subscription-db
      - user-service
      - notification-service
      - nats
    environment:
      - SUBSCRIPTION_SERVICE_PORT=8083
      - SUBSCRIPTION_SERVICE_HOST=0.0.0.0
      - SUBSCRIPTION_DB_HOST=subscription-db
      - SUBSCRIPTION_DB_PORT=5432
      - SUBSCRIPTION_DB_USER=postgres
      - SUBSCRIPTION_DB_PASSWORD=postgres
      - SUBSCRIPTION_DB_NAME=subscriptionapi
      - SUBSCRIPTION_DB_SSL_MODE=disable
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8082
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=8084
      - MESSAGE_BROKER_URL=nats://nats:4222
      - APP_URL=${APP_URL:-http://localhost:8080}
      # Observability
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - LOG_LEVEL=info
      - LOG_SAMPLING_DEBUG=0.01
      - LOG_SAMPLING_INFO=0.1
      - LOG_SAMPLING_WARN=0.8
      - LOG_SAMPLING_ERROR=1.0
    restart: unless-stopped
    networks:
      - app-network

  # Notification Service (HTTP REST + Message Consumer) with Metrics
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    ports:
      - "8084:8084"
      - "9084:9084"  # Dedicated metrics port
    depends_on:
      - nats
      - weather-service
      - user-service
    environment:
      - NOTIFICATION_SERVICE_PORT=8084
      - NOTIFICATION_SERVICE_HOST=0.0.0.0
      - MESSAGE_BROKER_URL=nats://nats:4222
      - SUBSCRIPTION_SERVICE_HOST=subscription-service
      - SUBSCRIPTION_SERVICE_PORT=8083
      - WEATHER_SERVICE_HOST=weather-service
      - WEATHER_SERVICE_PORT=8081
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8082
      - EMAIL_SMTP_HOST=smtp.gmail.com
      - EMAIL_SMTP_PORT=587
      - EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_FROM_NAME=Weather API
      - EMAIL_FROM_ADDRESS=${EMAIL_SMTP_USERNAME}
      - APP_URL=${APP_URL:-http://localhost:8080}
      # Observability
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - LOG_LEVEL=info
      - LOG_SAMPLING_DEBUG=0.01
      - LOG_SAMPLING_INFO=0.1
      - LOG_SAMPLING_WARN=0.8
      - LOG_SAMPLING_ERROR=1.0
    restart: unless-stopped
    networks:
      - app-network

  # API Gateway (Main Entry Point) with Metrics
  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    ports:
      - "8080:8080"  # Main UI and API endpoint
      - "9080:9080"  # Dedicated metrics port
    depends_on:
      - weather-service
      - user-service
      - subscription-service
    environment:
      - GATEWAY_SERVICE_PORT=8080
      - GATEWAY_SERVICE_HOST=0.0.0.0
      - WEATHER_SERVICE_HOST=weather-service
      - WEATHER_SERVICE_PORT=8081
      - USER_SERVICE_HOST=user-service
      - USER_SERVICE_PORT=8082
      - SUBSCRIPTION_SERVICE_HOST=subscription-service
      - SUBSCRIPTION_SERVICE_PORT=8083
      # Observability
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - LOG_LEVEL=info
      - LOG_SAMPLING_DEBUG=0.01
      - LOG_SAMPLING_INFO=0.1
      - LOG_SAMPLING_WARN=0.8
      - LOG_SAMPLING_ERROR=1.0
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  user_postgres_data:
  subscription_postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
